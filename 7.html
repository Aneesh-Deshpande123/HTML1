<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calender</title>
</head>
<body>
    <table>
        <tr id="row1">
            
        </tr>
    </table>
    <script>
        let row1=document.getElementById("row1");
        for(let i=1; i<=7; i++){
            row1.innerHTML+=`<td>${i}</td>`;
        }
    </script>
</body>
</html>
