<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bobby Passkeys</title>
</head>
<body>
   <table>
       <tr>
            <td>Password Quantity</td>
            <td><input type="number" id="pwdQty"></td>
       </tr> 
       <tr>
            <td>Password Size</td>
            <td><input type="number" id="pwdSize"></td>
       </tr> 
   </table>  
   <button id="submitBtn">Submit</button>
   <ol id="resultList">
        
   </ol>
   <script>
        let passwordQty = document.getElementById("pwdQty");
        let passwordSize = document.getElementById("pwdSize");
        let submitBtn = document.getElementById("submitBtn");
        let resultList = document.getElementById("resultList");

        function genPwd(size){
            let arr1 = "abcdefghijklmnopqrstuvwxyz".split("");
            let arr2 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            let arr3 = "1234567890".split("");
            let arr4 = [...arr1,...arr2,...arr3];
            let pswd = "";

            for(let i = 0; i<size; i++){
                let rand = Math.floor(Math.random() * arr4.length);
                pswd += arr4[rand];
            }

            return pswd;
        }
        
        submitBtn.onclick = function(){
            resultList.innerHTML = "";
            for(let i = 0; i<passwordQty.value; i++){
                resultList.innerHTML += `<li>${genPwd(passwordSize.value)}</li>`; 
            }
        }
   </script>
</body>
</html>
